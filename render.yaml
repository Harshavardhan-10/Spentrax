# Render Blueprint — deploys the Smart Expense Manager backend (free web
# service) and the static frontend (free forever, always on).
#
# LIFETIME-FREE DB: Render's free Postgres expires after 30 days, so the
# database lives on Neon (https://neon.tech — free tier, no expiration).
# After creating a Neon project, paste its connection string into the
# spentrax-api > Environment → DATABASE_URL once deployed (see DEPLOY.md).
#
# URLs after first deploy:
#   Frontend: https://spentrax-web.onrender.com
#   API:      https://spentrax-api.onrender.com
# (adjust CORS_ORIGINS / VITE_API_URL if you rename services)

services:
  - type: web
    name: spentrax-api
    runtime: python
    rootDir: Backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # seed_demo_data.py --if-missing creates the demo@example.com account only
    # when it is absent or empty (so a cold start never wipes existing data,
    # but an empty demo account always gets filled).
    startCommand: alembic upgrade head && python seed_demo_data.py --if-missing && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      # Add DATABASE_URL manually in Render dashboard -> spentrax-api ->
      # Environment -> paste your Neon connection string (see DEPLOY.md).
      # If left unset the app falls back to SQLite (data resets on redeploy).
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: AI_PROVIDER
        value: rule_based
      - key: AI_API_KEY
        value: ""
      - key: AI_MODEL
        value: ""
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: FRONTEND_URL
        value: https://spentrax-web.onrender.com
      - key: CORS_ORIGINS
        value: https://spentrax-web.onrender.com

  - type: web
    name: spentrax-web
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://spentrax-api.onrender.com